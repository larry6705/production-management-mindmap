# 高等生產管理

## 一 設計面
### 1 生產策略
#### 系統分類
- 專案型 / 零工式 / 批量 / 流線 / 連續
#### 接單策略
- MTS / ATO / MTO / ETO
- 顧客訂單解耦點 CODP
#### 策略架構
- 競爭優先序：成本 品質 交期 彈性 韌性 永續
- 能力取捨 vs. Sand Cone 累積能力
- 產品—製程矩陣 Hayes-Wheelwright
- 訂單資格條件 vs. 訂單贏得條件
- 全球製造網路佈局
#### 演進脈絡
- 科學管理 → MRP → MRP II/ERP → JIT/TPS → TOC → 智慧製造

### 2 產品設計
#### 開發流程
- Stage-Gate 制度
- 概念→系統→細部→試產→量產
- 併行工程 Concurrent Engineering
#### QFD 品質機能展開
- VOC → 工程特性 → 零件 → 製程 → 管制
#### DFX 家族
- DFM 可製造性 / DFA 易組裝
- DFQ / DFS 可服務性 / DfE 環境導向
- 設計階段鎖定 70-80% 產品成本
#### 架構與成本
- 模組化設計 / 產品平台 / 零件標準化
- BOM 設計：多階 / 模組化 / Planning BOM
- 價值工程 VE·VA / 目標成本制
#### 客製化前提
- 延遲策略 Postponement
- 解耦點設計
#### 變更管理
- ECN / ECO 對生產與庫存衝擊

### 3 製程設計
#### 製程選擇
- 製程型態與產品矩陣一致性
- 自動化程度：手動/半自動/全自動/FMS
- 設備選擇與投資評估
#### 製程分析
- 流程圖 / 製程圖 / 人機程序圖
#### 工作研究
- 方法研究：動作經濟原則 / ECRS
- 時間研究：碼錶測時 / 評比與寬放
- 預定動作時間 MTM·MOST / 工作抽查
- 標準工時用途：產能 排程 成本 績效
#### 生產線平衡
- 工作站分派 / 平衡效率 / 節拍時間
#### 群組技術
- 零件分類編碼 / 細胞式製造前提
#### 製程失效預防
- PFMEA / 管制計畫 / 製程確效
#### 新興議題
- 積層製造 AM / 人機協作單元

### 4 設施規劃與工廠佈置
#### 設施規劃
- 選址：因素評分 / 重心法 / 運輸模式
- 考量：市場 成本 勞動力 關稅 風險
- 廠房規模與階段性擴充
#### 佈置型態
- 固定位置式 / 製程別 / 產品別 / 細胞式
#### SLP 系統化佈置規劃
- P-Q-R-S-T 分析
- 關係圖 → 空間關係圖 → 方案評估
#### 分析工具
- 從至表 / 關係矩陣 / 流量-距離成本
- QAP 二次分派 / CRAFT·ALDEP·CORELAP
#### 物料搬運 MHS
- 設備選擇 / AGV·AMR 路徑與車隊
- 輸送帶配置
#### 倉儲佈置
- ABC 儲位 / 揀貨路徑 / 自動倉 AS·RS
#### 評估與精實觀點
- 物流成本 彈性 安全 人因
- U 型線 / 單件流 / 減少暫存

<script>
(function () {
  var md = document.getElementById('md').textContent;
  var transformer = new markmap.Transformer();
  var res = transformer.transform(md);
  var svg = d3.select('#mm');
  var mm = markmap.Markmap.create(svg.node(), {
    colorFreezeLevel: 2,
    initialExpandLevel: 3,
    maxWidth: 340,
    spacingVertical: 6,
    spacingHorizontal: 90,
    paddingX: 16,
    fitRatio: 0.92,
    duration: 300
  }, res.root);

  // 版面定案後再置中；視窗或容器尺寸變動時重新置中
  function refit() { try { mm.fit(); } catch (e) {} }
  // 初次繪製有 300ms 展開動畫，動畫結束後才量得到真正的內容範圍
  [0, 350, 700].forEach(function (t) { setTimeout(refit, t); });
  if (window.ResizeObserver) {
    new ResizeObserver(refit).observe(document.querySelector('main'));
  } else {
    window.addEventListener('resize', refit);
  }

  function setLevel(n) {
    (function walk(node, depth) {
      node.payload = node.payload || {};
      node.payload.fold = (n >= 0 && depth >= n) ? 1 : 0;
      (node.children || []).forEach(function (c) { walk(c, depth + 1); });
    })(res.root, 0);
    mm.renderData();
    [350, 700].forEach(function (t) { setTimeout(refit, t); });
  }

  document.getElementById('lv2').onclick = function () { setLevel(2); };
  document.getElementById('lv3').onclick = function () { setLevel(3); };
  document.getElementById('lv4').onclick = function () { setLevel(4); };
  document.getElementById('all').onclick = function () { setLevel(-1); };
  document.getElementById('fit').onclick = refit;
})();
</script>
